<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PIÈCE-SÛRE AI</title>
  <style>
    /* ... (Copie ici tout le style de la version Backend fournie précédemment) ... */
    :root{--bg:#f4f6fb;--text:#0f172a;--muted:#64748b;--accent:#0a84ff;--radius:22px;--font:-apple-system,sans-serif;}
    *{box-sizing:border-box}body{margin:0;font-family:var(--font);color:var(--text);background:linear-gradient(180deg,var(--bg),#e9eef8);}
    .hidden{display:none !important}.wrap{max-width:1500px;margin:0 auto;padding:14px 16px 24px;border-top:4px solid var(--accent);}
    header{padding:12px;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.9);border-bottom:1px solid #ddd;}
    h1{margin:0;font-size:20px;color:var(--accent)}.status{font-size:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
    .card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.05);border:1px solid #eee}
    .field{margin-bottom:12px}.label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
    input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff}
    button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer;font-weight:600;background:var(--accent);color:#fff;margin-right:8px}
    button.secondary{background:#eee;color:#333}button.success{background:#34c759}button.danger{background:#ff453a}
    ul{list-style:none;padding:0}li{padding:8px;border-bottom:1px solid #eee}li:last-child{border:0}
    .badge{display:inline-block;padding:4px 8px;background:#f0f9ff;border-radius:99px;font-size:11px;font-weight:600;color:#0056bf}
  </style>
</head>
<body>
<header>
  <h1>PIÈCE-SÛRE AI</h1>
  <div class="status"><span id="netStatus">Connexion</span> • <strong id="modeBadge">Local</strong></div>
</header>

<main class="wrap hidden" id="mainApp">
  <section class="card">
    <h2>Fiche client active</h2>
    <form id="clientForm">
      <input type="hidden" id="clientId">
      <div class="field"><label class="label">Nom</label><input id="clientName"></div>
      <div class="field"><label class="label">Véhicule</label><input id="clientVehicle"></div>
      <div class="field"><label class="label">VIN / Immatriculation</label><input id="clientVinPlate"></div>
      <div class="field"><label class="label">Code Moteur / OE</label><input id="clientEngineOE"></div>
      <button type="submit">Enregistrer</button>
      <button type="button" class="secondary" id="printBtn">Imprimer</button>
    </form>
  </section>
  
  <section class="card">
    <h2>Historique & Actions</h2>
    <ul id="historyList"></ul>
  </section>

  <section class="card">
    <h2>Clients enregistrés</h2>
    <ul id="clientsList"></ul>
  </section>
</main>

<div id="loginScreen">
  <div class="card" style="max-width:350px;margin:100px auto;text-align:center">
    <h1>Pièce-Sûre AI</h1>
    <p>Démo <strong>atelier</strong> / <strong>1234</strong></p>
    <button onclick="login()">Entrer</button>
  </div>
</div>

<script>
// --- Core Logic (Backend Aware) ---
const API_BASE = ''; // Auto-relative if on localhost
let state = { clients:[], history:[], messages:[], config:{}, activeId:'' };
const LS_KEY = 'psa_v2';

function loadState(){ 
  try{ state = JSON.parse(localStorage.getItem(LS_KEY)) || state; }catch{} 
  renderAll();
}

function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); renderAll(); }

async function apiCheck(){
  try{
    const res = await fetch('/api/health');
    if(res.ok){ document.getElementById('netStatus').textContent='SQLite OK'; document.getElementById('modeBadge').textContent='Hybride'; return true; }
  }catch(e){}
  document.getElementById('netStatus').textContent='Hors ligne'; document.getElementById('modeBadge').textContent='Local'; return false;
}

async function syncClients(data = null, method = 'GET'){
  if(!data && method !== 'GET') return;
  try{
    const req = method === 'GET' ? {} : {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)};
    const res = await fetch(method==='GET'?'/api/clients':`/api/clients`, req);
    if(res.ok){
      const json = await res.json();
      if(method==='GET') state.clients = json;
      else saveState();
    }
  }catch{}
}

// --- UI ---
window.onload = async () => {
  loadState();
  const hasApi = await apiCheck();
  if(hasApi) await syncClients(null, 'GET');
};

function login(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').classList.remove('hidden');
}

document.getElementById('clientForm').onsubmit = (e)=>{
  e.preventDefault();
  const c = { id: document.getElementById('clientId').value || 'new_'+Date.now(), name: document.getElementById('clientName').value, vehicle: document.getElementById('clientVehicle').value, vin: document.getElementById('clientVinPlate').value, engine: document.getElementById('clientEngineOE').value };
  state.clients.unshift(c);
  saveState();
};

function renderAll(){
  const clist = document.getElementById('clientsList');
  clist.innerHTML = state.clients.map(c=>`<li style="cursor:pointer" onclick="openClient('${c.id}')">${c.name} (${c.vehicle})</li>`).join('');
  
  const hlist = document.getElementById('historyList');
  hlist.innerHTML = state.history.slice(0,5).map(h=>`<li>${h.time} - ${h.event}</li>`).join('');
  
  if(state.activeId){
    const c = state.clients.find(x=>x.id==state.activeId);
    if(c){ document.getElementById('clientName').value=c.name||''; document.getElementById('clientVehicle').value=c.vehicle||''; document.getElementById('clientVinPlate').value=c.vin||''; document.getElementById('clientEngineOE').value=c.engine||''; document.getElementById('clientId').value=c.id; }
  }
}

window.openClient = (id)=>{ state.activeId=id; renderAll(); };

// --- Minimal Helper ---
function logAction(msg){ 
  state.history = [{time:new Date().toLocaleTimeString(), event:msg}, ...state.history].slice(0,20); 
  saveState(); 
  if(window.navigator.onLine) fetch('/api/history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'action',label:msg})}).catch(()=>{});
}

// Add listeners for printing etc...
document.getElementById('printBtn').onclick = ()=> window.print();
</script>
</body>
</html>
